Commentary: |-
    <i>Materia Collective:</i> ([Bandcamp description](https://trevorgomes.bandcamp.com/album/deltarune-piano-collections-vol-1), excerpt)
    Materia Collective and Materia Editions proudly present the official DELTARUNE Piano Collections, an elegant reimagining of [[artist:toby-fox]]'s acclaimed soundtrack, arranged and performed by [[artist:trevor-alan-gomes]] and produced by Sydney Kjerstad and Jamie Mac Rae.

    Featuring 14 masterful arrangements spanning music from Chapters 1 and 2, this first volume offers a complete experience for music enthusiasts and fans alike. With immersive Dolby Atmos mixes by Will Kennedy (available on supported platforms), it invites listeners to experience the depth and nuance of DELTARUNE’s music like never before—whether listening, playing, or collecting.
